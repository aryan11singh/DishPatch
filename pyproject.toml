[project]
name = "dishpatch"
version = "0.1.0"
description = "DishPatch - Stateful multi-turn AI restaurant ordering & kitchen lifecycle agent built with LangGraph, Groq, and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Aryan Singh", email = "111aryansingh2004@gmail.com" }
]
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
